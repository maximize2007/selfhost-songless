services:
  songless:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - songless-data:/data
    environment:
      DOWNLOAD_WORKERS: 4
      # SITE_PASSWORD: change-me       # uncomment to make the whole site private (login page for everyone)
      # ADMIN_PASSWORD: change-me      # uncomment so only you can import, sync and delete playlists
    restart: unless-stopped

volumes:
  songless-data:
